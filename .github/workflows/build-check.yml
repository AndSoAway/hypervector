name: cpp-build-check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libopenblas-dev liblapack-dev libgtest-dev

      - name: Configure and build generic core offline
        run: |
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core

      - name: Fail fast when GoogleTest is unavailable
        run: |
          if cmake -S . -B build/missing-gtest -G Ninja \
            -DBUILD_TESTING=ON \
            -DHYPERVEC_UNIT_TESTS_ONLY=ON \
            -DHYPERVEC_FETCH_DEPS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON; then
            echo "configuration unexpectedly succeeded without GoogleTest" >&2
            exit 1
          fi

      - name: Configure and build C++ tests from local dependencies
        run: |
          cmake -S . -B build/test -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DHYPERVEC_UNIT_TESTS_ONLY=ON \
            -DHYPERVEC_FETCH_DEPS=OFF \
            -DHYPERVEC_OPT_LEVEL=generic
          cmake --build build/test

      - name: Run C++ tests
        run: ctest --test-dir build/test --output-on-failure

      - name: Build C++ examples
        run: |
          cmake -S . -B build/examples -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHYPERVEC_ENABLE_EXTRAS=ON \
            -DHYPERVEC_OPT_LEVEL=generic
          cmake --build build/examples

      - name: Reject unavailable optimization targets during configuration
        run: |
          if cmake -S . -B build/unsupported -G Ninja \
            -DHYPERVEC_OPT_LEVEL=avx2; then
            echo "avx2 configuration unexpectedly succeeded" >&2
            exit 1
          fi
