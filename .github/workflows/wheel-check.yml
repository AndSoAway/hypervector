name: python-wheel-check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-dev python3-pip python3-venv \
            build-essential cmake ninja-build swig \
            libopenblas-dev liblapack-dev

      - name: Configure and build SWIG target
        run: |
          python3 -m venv /tmp/hv-venv
          /tmp/hv-venv/bin/python -m pip install --upgrade pip setuptools wheel cmake numpy
          /tmp/hv-venv/bin/cmake -S . -B build-wheel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHYPERVEC_ENABLE_PYTHON=ON \
            -DHYPERVEC_ENABLE_EXTRAS=OFF \
            -DHYPERVEC_OPT_LEVEL=generic \
            -DPython_EXECUTABLE=/tmp/hv-venv/bin/python
          /tmp/hv-venv/bin/cmake --build build-wheel --target swighypervec

      - name: Assemble wheel from the clean build dir snapshot
        run: |
          cd build-wheel/src/python
          /tmp/hv-venv/bin/python -m pip wheel . --no-deps -w dist

      - name: Install wheel and import gate
        run: |
          /tmp/hv-venv/bin/pip install numpy fastapi uvicorn hypercorn h2
          /tmp/hv-venv/bin/pip install --force-reinstall --no-deps build-wheel/src/python/dist/*.whl
          /tmp/hv-venv/bin/python - <<'PY'
          import hypervec
          import hypervec.hypervec_server_engine
          import hypervec.hypervec_http_server
          index = hypervec.create_index("flat", 2, hypervec.kMetricL2, {})
          assert index.d == 2
          print("import-ok")
          PY
