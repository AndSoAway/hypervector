syntax = "proto3";

package hypervec.v1;

service HypervecService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc HasCollection(HasCollectionRequest) returns (HasCollectionResponse);
  rpc DescribeCollection(DescribeCollectionRequest) returns (JsonResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (JsonResponse);
  rpc DropCollection(DropCollectionRequest) returns (JsonResponse);
  rpc Insert(InsertRequest) returns (JsonResponse);
  rpc Flush(CollectionRequest) returns (JsonResponse);
  rpc LoadCollection(CollectionRequest) returns (JsonResponse);
  rpc CloseCollection(CollectionRequest) returns (JsonResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetVersion(CollectionRequest) returns (JsonResponse);
  rpc SyncCheck(SyncCheckRequest) returns (JsonResponse);
  rpc DownloadIndex(CollectionRequest) returns (DownloadIndexResponse);
  rpc UploadIndex(UploadIndexRequest) returns (JsonResponse);
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
}

message ListCollectionsRequest {}
message ListCollectionsResponse {
  repeated string collections = 1;
}

message CollectionRequest {
  string collection_name = 1;
}

message HasCollectionRequest {
  string collection_name = 1;
}
message HasCollectionResponse {
  string collection_name = 1;
  bool exists = 2;
}

message DescribeCollectionRequest {
  string collection_name = 1;
}

message CreateCollectionRequest {
  string collection_name = 1;
  string schema_json = 2;
  string index_params_json = 3;
}

message DropCollectionRequest {
  string collection_name = 1;
}

message InsertRequest {
  string collection_name = 1;
  string data_json = 2;
}

message SearchRequest {
  string collection_name = 1;
  string data_json = 2;
  int32 limit = 3;
  string search_params_json = 4;
  repeated string output_fields = 5;
  string filter = 6;
  string consistency_level = 7;
  bytes data_bytes = 8;
  int32 dim = 9;
  int32 num_rows = 10;
}

message SearchHit {
  string id = 1;
  double distance = 2;
  string entity_json = 3;
}

message SearchResult {
  repeated SearchHit hits = 1;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message SyncCheckRequest {
  string collection_name = 1;
  int64 client_version = 2;
  string client_checksum = 3;
}

message DownloadIndexResponse {
  bytes data = 1;
  int64 version = 2;
  string index_checksum = 3;
  int64 index_size_bytes = 4;
}

message UploadIndexRequest {
  string collection_name = 1;
  bytes data = 2;
  int64 version = 3;
  string checksum = 4;
}

message JsonResponse {
  string json = 1;
}
