[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhypervec"
version = "0.1.0"
description = "Python HTTP and gRPC client for HyperVector server."
requires-python = ">=3.10"
dependencies = [
  "h2>=4.0",
  "httpx[http2]>=0.27",
]

[project.optional-dependencies]
grpc = [
  "grpcio>=1.83,<2",
  "protobuf>=7.35.1,<8",
]
grpc-dev = [
  "grpcio-tools>=1.83,<2",
]

[tool.setuptools.packages.find]
where = ["."]
