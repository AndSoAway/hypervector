global:
  dataset_path: /path/to/sift-128-euclidean.hdf5
  action: build_search
  top_k: 10
  search_query_count: 0
  num_threads_building: 4
  num_threads_searching: 4
  enable_recall: true
  enable_percent_recall: true
  enable_qps: true
  enable_tps: true
  enable_memory: true
  enable_latency: true
  enable_percent_latency: true
  use_id_based_recall: false

output:
  format: table
  path: ""
  append: false

cases:
  - name: hnsw-flat
    index_config: tools/eval/configs/hnsw_flat.json
    search_config: tools/eval/configs/hnsw_search.json

  - name: ivf-flat
    index_config: tools/eval/configs/ivf_flat.json
    search_config: tools/eval/configs/ivf_search.json
